name: Release

# Fires when you push a version tag (e.g. `git push --tags` after
# scripts/release.sh). Verifies the tag matches the project version, runs tests
# if it's a Node project, extracts that version's CHANGELOG section, and
# publishes a GitHub Release with those notes.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node steps run only if the project has a package.json.
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: '20'
      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm install
      - name: Run tests
        if: ${{ hashFiles('package.json') != '' }}
        run: npm test

      # Rust steps run only if the project has a Cargo.toml (cargo is preinstalled
      # on GitHub's ubuntu runners).
      - name: Run Rust tests
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: cargo test

      - name: Verify tag matches project version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -f package.json ]; then
            VER="$(node -p "require('./package.json').version")"
          elif [ -f Cargo.toml ]; then
            VER="$(awk -F'"' '/^\[/{p=($0 ~ /^\[package\]/)} p && /^[[:space:]]*version[[:space:]]*=/{print $2; exit}' Cargo.toml)"
          elif ls -d *.xcodeproj >/dev/null 2>&1; then
            VER="$(grep -m1 -E 'MARKETING_VERSION[[:space:]]*=' *.xcodeproj/project.pbxproj | sed -E 's/.*MARKETING_VERSION[[:space:]]*=[[:space:]]*([^;]+);.*/\1/' | tr -d '[:space:]')"
          elif [ -f Makefile ] && grep -qE '^[[:space:]]*VERSION[[:space:]]*=' Makefile; then
            VER="$(grep -E '^[[:space:]]*VERSION[[:space:]]*=' Makefile | head -n1 | sed -E 's/^[[:space:]]*VERSION[[:space:]]*=[[:space:]]*//')"
          elif [ -f VERSION ]; then
            VER="$(tr -d '[:space:]' < VERSION)"
          else
            echo "::warning::No recognized version source; skipping version check"
            VER="$TAG"
          fi
          echo "tag=$TAG version=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG does not match project version $VER"
            exit 1
          fi

      - name: Extract CHANGELOG section
        run: |
          awk -v ver="## [${GITHUB_REF_NAME#v}]" '
            index($0, ver) == 1 { f = 1; next }
            f && index($0, "## [") == 1 { exit }
            f { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "----- release notes -----"; cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
